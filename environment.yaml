# Sets up the MAYA_DC conda environment.
# All Python package versions are declared in pyproject.toml — this file
# only pins the Python interpreter and delegates everything else to pip.
#
# Create:   conda env create -f environment.yaml
# Update:   conda env update -f environment.yaml --prune
# Activate: conda activate MAYA_DC
#
# Run from the repo root so that the local `file:` references in
# pyproject.toml (Maya4/, srp/) resolve correctly.

name: MAYA_DC

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.12
  - pip>=23

  - pip:
      # Install the project and all its dependencies (including dev tools)
      # from pyproject.toml in one shot.
      - -e ".[dev]"
