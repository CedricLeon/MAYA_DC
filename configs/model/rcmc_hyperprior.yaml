_target_: src.models.rcmc_compress_module.RCMCDCmodule

net:
  _target_: src.models.components.scale_hyperprior.ScaleHyperprior
  nb_input_channels: 2
  nb_channels_main: 64
  activation: gdn

criterion:
  _target_: src.models.criteria.SARRateDistortionCriterion
  lmbda: 0.01
  include_rate: true

focus:
  _target_: src.models.components.azimuth_focus.TorchAzimuthFocus

net_optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.0001

aux_optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.001

scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
  mode: min
  factor: 0.5
  patience: 5

gradient_clip_norm: 1.0
compile: false
