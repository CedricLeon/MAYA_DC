# @package _global_

# Experiment configuration for RCMC compression
# This combines model, data, and trainer settings

defaults:
  - override /data: maya4.yaml
  - override /model: rcmc_compress.yaml
  - override /callbacks: default.yaml
  - override /logger: wandb.yaml
  - override /trainer: gpu.yaml
  - override /hydra: default.yaml

# Experiment metadata
tags: ["rcmc_compression", "scale_hyperprior", "maya4"]
experiment_name: "rcmc_compress_baseline"

# Seed for reproducibility
seed: 42

# Azimuth buffer size (shared between data and model)
# NOTE: Total size (patch_size + 2*buffer) must be divisible by 16
# Examples: patch=512  buffer=128 ->  768 ( 768/16=48  ✓)  ~2 GB VRAM
#           patch=1024 buffer=256 -> 1536 (1536/16=96  ✓)  ~4 GB VRAM  ← baseline
#           patch=2048 buffer=512 -> 3072 (3072/16=192 ✓)  ~12 GB VRAM (requires A100+)
azimuth_buffer: 512

# Trainer configuration
trainer:
  max_epochs: 1
  accelerator: "gpu"
  devices: 1
  precision: "32-true"  # cuFFT needs power-of-2 sizes for "16-mixed"

  # Validation and checkpointing
  # val_check_interval and check_val_every_n_epoch are mutually exclusive in Lightning;
  # use only check_val_every_n_epoch.
  check_val_every_n_epoch: 1

# Data configuration
data:
  patch_size: [512, 512]
  batch_size: 4
  num_workers: 4
  # Use 10 products × 50 patches/product = ~500 patches/epoch for a quick first run.
  # Scale up max_products_train for full training (e.g., 200 products, samples_per_prod=0 for all patches).
  max_products_train: 5
  max_products_val: 1
  max_products_test: 2
  samples_per_prod: 100   # patches per product per epoch; 0 = all
  online: false          # set true ONCE to download; keep false afterward
  azimuth_buffer: ${azimuth_buffer}  # Reference top-level parameter

# Model configuration
model:
  azimuth_buffer: ${azimuth_buffer}  # Reference top-level parameter
  net:
    nb_input_channels: 2
    nb_channels_main: 128
  criterion:
    lmbda: 0.01
  net_optimizer:
    lr: 0.0001

# Logging
logger:
  wandb:
    entity: "cedric-leonard"
    project: "MAYA_DC"
    offline: False

# Callbacks
callbacks:
  monitor_val_recon:
    log_every_n_epochs: 1
    num_images: 3

  model_checkpoint:
    monitor: "valid/loss"
    mode: "min"
    save_top_k: 3
    filename: "epoch_{epoch:03d}_loss_{valid/loss:.4f}"

  early_stopping:
    monitor: "valid/loss"
    patience: 10
    mode: "min"
