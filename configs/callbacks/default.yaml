defaults:
  - model_checkpoint
  - early_stopping
  - model_summary
  - rich_progress_bar
  - monitor_val_recon
  - _self_

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  monitor: "valid/loss"
  mode: "min"
  filename: "epoch_{epoch:03d}_loss_{valid/loss:.4f}"
  save_last: True
  auto_insert_metric_name: False

early_stopping:
  monitor: "valid/loss"
  patience: 10
  mode: "min"

model_summary:
  max_depth: 2
