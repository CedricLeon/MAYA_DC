# @package _global_

defaults:
  - _self_
  - data: maya4_dir
  - model: rcmc_compress
  - training_mode: slc
  - logger: csv
  - trainer: default
  - paths: default
  - extras: default
  - hydra: default

# Shared patch geometry — referenced by data + training_mode.
patch_size: [512, 512]
azimuth_buffer: 512

# @TODO: default eval task_name to "eval/<dataset>/<model>" without duplicating the experiment file
task_name: "eval"

tags: ["dev"]

# passing checkpoint path is necessary for evaluation
ckpt_path: ???
