[project]
name = "maya-dc"
version = "0.1.0"
description = "Early Compression of SAR Data Pre-Focusing using Neural Image Compression"
readme = "README.md"
requires-python = ">=3.12"
# All Python dependencies are declared here.
# To set up: conda env create -f environment.yaml  (recommended)
# Or directly: pip install -e ".[dev]"
dependencies = [
    # --- PyTorch ---
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    # --- Lightning ecosystem ---
    "lightning>=2.6.0",
    "torchmetrics>=1.8.0",
    "pytorch-msssim>=0.2.1",
    # --- Neural image compression ---
    "compressai>=1.2.8",
    # --- Hydra (versions are tightly coupled — do not loosen) ---
    "hydra-core==1.3.2",
    "hydra-colorlog==1.2.0",
    "hydra-optuna-sweeper==1.2.0",
    "hydra-submitit-launcher==1.2.0",
    # --- SAR data & I/O ---
    "zarr>=3.1.5",
    "numcodecs>=0.12.0",
    "fsspec>=2023.10.0",
    "huggingface-hub>=1.0.0",
    # --- Scientific stack ---
    "numpy>=2.0.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scikit-image>=0.21.0",
    "scikit-learn>=1.3.0",
    # --- Vision / signal ---
    "kornia>=0.8.0",
    "einops>=0.8.0",
    # --- Logging ---
    "wandb>=0.24.0",
    "wandb-osh>=1.2.0",
    "tensorboard>=2.15.0",
    "seaborn>=0.13.0",
    # --- Utilities ---
    "rich>=13.0.0",
    "rootutils",
    "python-dotenv>=1.0.0",
    # --- Local packages (editable, resolved via pip install -e .) ---
    "maya4 @ file:Maya4",
    "sarpyx @ file:srp",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
    "sh>=2.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = true
markers = [
  "slow: slow tests",
]
minversion = "6.0"
testpaths = "tests/"

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]
