[project]
name = "maya-dc"
version = "1.0.0"
description = "Early Compression of SAR Data Pre-Focusing using Neural Image Compression"
readme = "README.md"
requires-python = ">=3.12"
# All Python dependencies are declared here.
# To set up: conda env create -f environment.yaml  (recommended)
# Or directly: pip install -e ".[dev]"
dependencies = [
    # --- PyTorch ---
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    # --- Lightning ecosystem ---
    "lightning>=2.6.0",
    "torchmetrics>=1.8.0",
    "pytorch-msssim>=0.2.1",
    # --- Neural image compression ---
    # The latest PyPI compressai (1.2.8) caps numpy<2.0, conflicting with our numpy>=2.0 stack.
    # That cap was removed on compressai main (1.2.9.dev0 → numpy>=1.24.4) but is not yet released.
    # TODO(compressai-pypi): switch back to "compressai>=1.2.9" once it ships to PyPI.
    "compressai @ git+https://github.com/InterDigitalInc/CompressAI",
    # --- Hydra (versions are tightly coupled — do not loosen) ---
    "hydra-core==1.3.2",
    "hydra-colorlog==1.2.0",
    "hydra-optuna-sweeper==1.2.0",
    "hydra-submitit-launcher==1.2.0",
    # --- SAR data & I/O ---
    "zarr>=3.1.5",
    "numcodecs>=0.12.0",
    "fsspec>=2023.10.0",
    # >=1.5.0 required: maya4's bucket loader needs download_bucket_files / list_bucket_tree.
    "huggingface-hub>=1.5.0",
    # --- Scientific stack ---
    "numpy>=2.0.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scikit-image>=0.21.0",
    "scikit-learn>=1.3.0",
    # --- Vision / signal ---
    "kornia>=0.8.0",
    "einops>=0.8.0",
    # --- Logging ---
    "wandb>=0.24.0",
    "wandb-osh>=1.2.0",
    "tensorboard>=2.15.0",
    "seaborn>=0.13.0",
    # --- Utilities ---
    "rich>=13.0.0",
    "rootutils",
    "python-dotenv>=1.0.0",
    # --- SAR domain packages (were vendored local clones pre-2026-06; see docs/dependency-bump-notes.md) ---
    # sarpyx: published on PyPI, works as-is.
    "sarpyx>=0.1.10",
    # maya4: the PyPI release (0.1.2) is UNUSABLE here — its dataloader still calls the
    # zarr-v2 `zarr.hierarchy` API (broken under our zarr>=3.1.5) AND it lacks HF-bucket
    # support. Only the upstream `pypi` branch fixes both (zarr v3 + download_bucket_files,
    # needed for the ESA-philab/Maya4 bucket). Tracking the branch until it ships to PyPI.
    # TODO(maya4-pypi): the maintainer will publish origin/pypi to PyPI — switch this to a
    #   PyPI pin (e.g. "maya4>=<new>") then. Last-good verified commit for debugging: c535776.
    "maya4 @ git+https://github.com/sirbastiano/Maya4@pypi",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
    "sh>=2.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = true
markers = [
  "slow: slow tests",
]
minversion = "6.0"
testpaths = "tests/"

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]
